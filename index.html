  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
function launch(app) {
  try {
    if (app.sync && app.sync.token) {
      const cur = JSON.parse(localStorage.getItem('emb_hub_sync_cfg') || '{}');
      if (!cur.token) localStorage.setItem('emb_hub_sync_cfg', JSON.stringify({ ...cur, ...app.sync }));
    }
  } catch (e) {}
  // Only replace the page once the lock screen has fully loaded — writing while it is
  // still loading would insert the app INSIDE the lock screen (broken layout).
  const go = () => { document.open(); document.write(app.html); document.close(); };
  if (document.readyState === 'complete') setTimeout(go, 0);
  else window.addEventListener('load', () => setTimeout(go, 0), { once: true });
}
async function tryRemembered() {
  try {
    const r = JSON.parse(localStorage.getItem(RK) || 'null');
    if (!r || r.salt !== P.salt) return false;
    const key = await crypto.subtle.importKey('raw', u8(r.k), { name: 'AES-GCM' }, false, ['decrypt']);
    launch(await decryptWith(key));
    return true;
  } catch (e) { try { localStorage.removeItem(RK); } catch (_) {} return false; }
}
$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('pw').value; if (!pw) return;
  $('go').disabled = true; $('msg').className = 'msg ok'; $('msg').textContent = 'Unlocking…';
  try {
    const key = await deriveKey(pw);
    const app = await decryptWith(key);
    if ($('rem').checked) { try { localStorage.setItem(RK, JSON.stringify({ salt: P.salt, k: b64(await crypto.subtle.exportKey('raw', key)) })); } catch (_) {} }
    launch(app);
  } catch (err) {
    $('go').disabled = false; $('msg').className = 'msg';
    $('msg').textContent = window.crypto && crypto.subtle ? 'Wrong password' : 'This browser cannot unlock the page (needs HTTPS).';
    $('pw').select();
  }
});
if (!(window.crypto && crypto.subtle)) { $('msg').textContent = 'Open this page over HTTPS to unlock.'; }
else tryRemembered();
</script>
