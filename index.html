<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c0f16;color:#e2e8f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px}
  .box{width:100%;max-width:340px;background:#131720;border:1px solid #242d40;border-radius:14px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .ico{font-size:34px;margin-bottom:10px}
  h1{font-size:16px;font-weight:600;margin-bottom:18px;color:#c8d2e8}
  input[type=password]{width:100%;background:#1a2030;border:1px solid #2e3a55;border-radius:9px;color:#e2e8f5;font-size:15px;padding:11px 12px;outline:none;text-align:center;letter-spacing:.5px}
  input[type=password]:focus{border-color:#8b7cf8}
  label{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#8899bb;margin:12px 0 16px;cursor:pointer;user-select:none}
  label input{accent-color:#22c77a}
  button{width:100%;background:#22c77a;color:#06140d;border:none;border-radius:9px;font-size:14px;font-weight:700;padding:11px;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .msg{min-height:18px;font-size:12px;margin-top:12px;color:#f87171}
  .msg.ok{color:#8899bb}
</style>

const RK = "nl_k_v1";
const $ = id => document.getElementById(id);
const u8 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };

// v1: the password key opens the page directly. v2: the page is locked with a random key that is
// stored once per allowed password ("slots") — so two different passwords can open the same page.
async function decryptWith(key) {
  let k = key;
  if (P.slots) {
    k = null;
    for (const s of P.slots) {
      try { const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(s.iv) }, key, u8(s.k)); k = await crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']); break; } catch (e) {}
    }
    if (!k) throw new Error('no slot');
  }
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, k, u8(P.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

}
function launch(app) {
  try {
    if (app.sync && app.sync.token) {
      const sk = app.syncKey || 'emb_hub_sync_cfg';
      const cur = JSON.parse(localStorage.getItem(sk) || '{}');
      // fill in on a new device; keep it current when the built-in token is replaced
      if (!cur.token || (cur.embedded && cur.token !== app.sync.token)) localStorage.setItem(sk, JSON.stringify({ ...cur, ...app.sync, embedded: true }));
    }
  } catch (e) {}
  // Only replace the page once the lock screen has fully loaded — writing while it is
  // still loading would insert the app INSIDE the lock screen (broken layout).
  const go = () => { document.open(); document.write(app.html); document.close(); };
  if (document.readyState === 'complete') setTimeout(go, 0);
  else window.addEventListener('load', () => setTimeout(go, 0), { once: true });
}
async function tryRemembered() {
  try {
    const r = JSON.parse(localStorage.getItem(RK) || 'null');
    if (!r || r.salt !== P.salt) return false;
    const key = await crypto.subtle.importKey('raw', u8(r.k), { name: 'AES-GCM' }, false, ['decrypt']);

    const key = await deriveKey(pw);
    const app = await decryptWith(key);
    if ($('rem').checked) { try { localStorage.setItem(RK, JSON.stringify({ salt: P.salt, k: b64(await crypto.subtle.exportKey('raw', key)) })); } catch (_) {} }
    launch(app);
  } catch (err) {
    $('go').disabled = false; $('msg').className = 'msg';
    $('msg').textContent = window.crypto && crypto.subtle ? 'Wrong password' : 'This browser cannot unlock the page (needs HTTPS).';
    $('pw').select();
  }
});
async function ensureFresh() {
  if (!/^https?:$/.test(location.protocol)) return true;
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 3000);
    const r = await fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
    if (!r.ok) return true;
    const m = (await r.text()).match(/"ct":"([^"]{0,80})/);
    if (m && m[1] !== P.ct.slice(0, m[1].length)) {
      $('msg').className = 'msg ok'; $('msg').textContent = 'Loading the latest version…';
      location.replace(location.pathname + '?v=' + Date.now());
      return false;
    }
  } catch (e) {}
  return true;
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!(window.crypto && crypto.subtle)) { $('msg').textContent = 'Open this page over HTTPS to unlock.'; }
else ensureFresh().then(ok => { if (ok) tryRemembered(); });
</script>
